  <main class="j-wrap">
    <section class="diary" aria-labelledby="homeTitle">
      <div class="diary-page diary-left">
        <header class="diary-head">
          <div class="date-stamp" aria-label="今天的日期">
            <span class="y" data-date="year"></span>
            <span class="md" data-date="md"></span>
            <span class="w" data-date="weekday"></span>
          </div>
          <div class="diary-head-text">
            <p class="eyebrow">写给宝宝的一页</p>
            <h1 id="homeTitle" class="hand">今天，写给你。</h1>
          </div>
        </header>

        <a class="diary-letter lined" href="messages.html">
          <img class="sticker" src="assets/journal/sticker-letter.webp" alt="" style="right: -18px; top: -34px; width: 92px; transform: rotate(10deg)">
          <span class="label">最近悄悄跟你说的</span>
          <p class="text" id="homeLatestMessageText">……</p>
          <span class="more">翻到悄悄话 →</span>
        </a>

        <a class="diary-tea" href="milk-tea.html" data-tea-card>

          <span class="row rule"><span>你的上一杯</span><span data-tea="name">还没摇呢</span></span>
          <span class="row" data-tea-row hidden><span>品牌</span><span data-tea="brand">—</span></span>
          <span class="row" data-tea-row hidden><span>那天</span><span class="num" data-tea="date">—</span></span>
        </a>
      </div>

      <div class="diary-page diary-right">
        <figure class="spread-card">
          <span class="tape" style="left: 34px; transform: rotate(-4deg)"></span>
          <span class="tape navy" style="right: 30px; width: 84px; transform: rotate(5deg)"></span>
          <div class="spread-art">
            <img src="assets/journal/home-spread.webp" alt="手账跨页：左边杭州的西湖，右边纽约的布鲁克林大桥" width="1400" height="933">

              <small>杭州 · <span data-daypart="hz"></span></small>
              <strong data-clock="hz">--:--</strong>
            </div>
            <div class="time-chip night">
              <small>纽约 · <span data-daypart="ny"></span></small>
              <strong data-clock="ny">--:--</strong>
            </div>
          </div>
          <figcaption class="hand">隔着十二小时，我们在同一条轨道上</figcaption>
        </figure>

        <a class="diary-photo" href="albums.html">
          <span class="tape gold" style="top: -12px; left: 50%; width: 70px; margin-left: -35px; transform: rotate(-3deg)"></span>
          <img src="photos/1.jpg" alt="照片站里的一张照片" loading="lazy" decoding="async">
          <span class="hand">我们的照片</span>
        </a>

        <div class="diary-figure-wrap" data-figure-today>
          <a class="diary-figure" href="figures.html#figure-213103" data-figure="link">
            <div class="portrait"><img src="assets/journal/domes/chuyin.webp" alt="初音未来手办" data-figure="img"></div>
            <span class="label">今天陪着你的</span>
            <strong data-figure="name">初音未来</strong>
            <span class="hand" data-figure="line">今天也想把最好听的歌，唱给雪雪一个人听。</span>
          </a>
          <button class="figure-shuffle" type="button" data-figure="shuffle" aria-label="随机换一个手办和情话">随机</button>
        </div>

    <section class="diary-more" aria-label="接着往下翻">

        <div class="cover">
          <img data-comic="cover" src="assets/star-rail-comic/covers/chapter-03.webp" alt="星轨漫画最新一篇封面" loading="lazy" decoding="async">
        </div>
        <div class="body">
          <span class="no" data-comic="no">TICKET · NO. 03</span>
          <h3 data-comic="title">名字抵达之前</h3>
          <p data-comic="summary">空白离开以后，馆长做的第一件事，不是追问维泽在十二小时之外看见了什么。</p>
          <div class="go"><span>十二小时之外的星轨</span><span aria-hidden="true">→</span></div>
        </div>
      </a>
