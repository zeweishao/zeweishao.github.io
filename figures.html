  <main class="j-wrap">
    <section class="j-page-head" aria-labelledby="figureGalleryTitle">
      <img class="sticker" src="assets/journal/sticker-figures.webp" alt="" style="left: min(330px, 62%); top: 14px; transform: rotate(8deg)">
      <p class="eyebrow">figure collection</p>
      <h1 id="figureGalleryTitle">小手办陈列馆</h1>
      <p class="sub">把喜欢的人物，放在不会熄灭的光里。</p>
    </section>

    <section class="figure-feature" aria-label="今日陪伴" id="figureFeature">
      <div class="figure-polaroid">
        <span class="tape" style="top: -14px; left: 34px; transform: rotate(-6deg)"></span>
        <span class="tape gold" style="top: -12px; right: 30px; width: 80px; transform: rotate(8deg)"></span>
        <div class="stage"><img data-fig="img" src="assets/figure-story/characters/wiki/31-优纪.png" alt="优纪手办"></div>
        <span class="name" data-fig="name">优纪</span>
        <span class="no">today</span>
      </div>
      <div class="figure-copy">
        <span class="tag-stamp">今日陪伴</span>
        <h2 data-fig="name">优纪</h2>
        <p class="figure-quote lined" data-fig="quote">如果你偶尔忘了自己有多值得被珍惜，就看着我；我会一遍一遍说给你听。</p>
      </div>
    </section>

    <section aria-labelledby="albumHead" style="margin-top: 80px">
      <div class="j-section-head" style="border-bottom: 1px dashed var(--brass); padding-bottom: 14px">
        <h2 id="albumHead">收藏册</h2>
      </div>
      <div class="figure-curation-grid" id="figureCharacterRail"></div>
    </section>

    <footer class="j-footer">
      <span class="hand">她们都在光里等你。</span>
      <span class="num">figure collection · isnow.life</span>
