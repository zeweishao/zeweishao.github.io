<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f5eee3">
  <title>照片站｜属于我们的小世界</title>
  <link rel="icon" href="assets/journal/logo-seal.webp" type="image/webp">
  <link rel="stylesheet" href="journal.css?v=20261002">
</head>
<body class="journal sub-page">
  <header class="topbar">
    <a class="j-brand" href="index.html">
      <img src="assets/journal/logo-seal.webp" alt="" width="44" height="44">
      <span>属于我们的小世界</span>
    </a>
    <nav class="j-tabs" aria-label="主导航">
      <a href="index.html">小家</a>
      <a href="figures.html">小手办</a>
      <a href="milk-tea.html">奶茶小屋</a>
      <a href="messages.html">悄悄话</a>
      <a class="is-active" href="albums.html" aria-current="page">照片站</a>
      <a class="is-night" href="comic.html">星轨漫画</a>
    </nav>
    <details class="j-menu">
      <summary>目录</summary>
      <nav class="j-menu-panel" aria-label="主导航">
        <a href="index.html">小家</a>
        <a href="figures.html">小手办</a>
        <a href="milk-tea.html">奶茶小屋</a>
        <a href="messages.html">悄悄话</a>
        <a class="is-active" aria-current="page" href="albums.html">照片站</a>
        <a href="comic.html">星轨漫画</a>
      </nav>
    </details>
  </header>

  <main class="j-wrap">
    <section class="j-page-head" aria-labelledby="albumTitle">
      <img class="sticker" src="assets/journal/sticker-photo.webp" alt="" style="left: min(440px, 62%); top: 18px; transform: rotate(8deg)">
      <p class="eyebrow">memory album</p>
      <h1 id="albumTitle">时间没有停下，<br>但那些光还在。</h1>
    </section>

    <section aria-labelledby="filmTitle" style="margin-top: 50px">
      <div class="j-section-head">
        <h2 id="filmTitle">影像</h2>
      </div>
      <div class="film-row">
        <div class="film-strip">
          <video controls preload="metadata" playsinline poster="photos/birthday-video-poster.webp">
            <source src="videos/shengrikuaile.mp4" type="video/mp4">
          </video>
        </div>
        <div class="film-copy">
          <span class="tag-stamp">影像</span>
          <h3>生日快乐</h3>
        </div>
      </div>
    </section>

    <section aria-labelledby="photoTitle" style="margin-top: 80px">
      <div class="j-section-head">
        <h2 id="photoTitle">照片墙</h2>
      </div>
      <div class="polaroid-wall">
        <figure class="memory-photo"><img src="photos/1.jpg" alt="回忆照片一" loading="lazy" decoding="async"><figcaption>No. 01</figcaption></figure>
        <figure class="memory-photo"><img src="photos/2.jpg" alt="回忆照片二" loading="lazy" decoding="async"><figcaption>No. 02</figcaption></figure>
        <figure class="memory-photo"><img src="photos/3.jpg" alt="回忆照片三" loading="lazy" decoding="async"><figcaption>No. 03</figcaption></figure>
        <figure class="memory-photo"><img src="photos/4.jpg" alt="回忆照片四" loading="lazy" decoding="async"><figcaption>No. 04</figcaption></figure>
        <figure class="memory-photo"><img src="photos/5.jpg" alt="回忆照片五" loading="lazy" decoding="async"><figcaption>No. 05</figcaption></figure>
        <figure class="memory-photo"><img src="photos/6.jpg" alt="回忆照片六" loading="lazy" decoding="async"><figcaption>No. 06</figcaption></figure>
      </div>
    </section>

    <dialog class="memory-lightbox" id="memoryLightbox" aria-label="照片预览">
      <button type="button" aria-label="关闭照片预览">×</button>
      <img alt="">
    </dialog>

    <footer class="j-footer">
      <span class="hand">那些光还在。</span>
      <span class="num">memory album · isnow.life</span>
    </footer>
  </main>

  <script src="app.js"></script>
  <script>
    (() => {
      const dialog = document.getElementById("memoryLightbox");
      const image = dialog?.querySelector("img");
      document.querySelectorAll(".memory-photo img").forEach((photo) => {
        photo.addEventListener("click", () => {
          if (!dialog || !image) return;
          image.src = photo.src;
          image.alt = photo.alt;
          dialog.showModal();
        });
      });
      dialog?.querySelector("button")?.addEventListener("click", () => dialog.close());
      dialog?.addEventListener("click", (event) => {
        if (event.target === dialog) dialog.close();
      });
    })();
  </script>
  <script src="journal.js?v=20261002"></script>
</body>
</html>
