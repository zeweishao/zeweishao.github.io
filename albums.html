<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#050b16">
  <meta name="description" content="属于我们的小世界 · 照片与回忆影像。">

  <link rel="stylesheet" href="archive-theme.css?v=20260725">
  <link rel="stylesheet" href="orbit-refresh.css?v=20260725">
  <link rel="stylesheet" href="motion-system.css?v=20260726">
</head>
<body class="figure-site sub-page albums-page">
  <div class="orbit-grain" aria-hidden="true"></div>

  <header class="site-topbar topbar orbit-topbar">
    <a class="site-brand brand figure-brand" href="index.html">
      <span class="site-brand-mark brand-badge figure-brand-badge orbit-brand-sigil" aria-hidden="true"><i></i></span>
      <span>
        <strong>属于我们的小世界</strong>
      </span>
    </a>
    <nav class="site-nav top-nav" aria-label="主导航">
      <div class="site-nav-tabs figure-nav-tabs" aria-label="小世界入口">
        <a href="index.html">小家</a>
        <a href="figures.html">小手办</a>
        <a href="milk-tea.html">奶茶小屋</a>
        <a href="messages.html">悄悄话</a>
        <a class="is-active" href="albums.html" aria-current="page">照片站</a>
        <a href="comic.html">漫画站</a>
      </div>
      <details class="site-menu menu-dropdown">
        <summary class="site-menu-toggle menu-toggle">
          <span class="menu-icon" aria-hidden="true">≡</span>
          <span>导航</span>
          <span class="menu-caret" aria-hidden="true">▾</span>
        </summary>
        <div class="site-menu-panel menu-panel">
          <a href="index.html"><span aria-hidden="true">⌂</span><span>首页</span></a>
          <a href="figures.html"><span aria-hidden="true">◇</span><span>小手办</span></a>
          <a href="milk-tea.html"><span aria-hidden="true">☕</span><span>奶茶小屋</span></a>
          <a href="messages.html"><span aria-hidden="true">✉</span><span>悄悄话</span></a>
          <a class="active" href="albums.html"><span aria-hidden="true">▦</span><span>照片站</span></a>
          <a href="comic.html"><span aria-hidden="true">✦</span><span>漫画站</span></a>
        </div>
      </details>
    </nav>
  </header>

  <main class="memory-shell">
    <section class="memory-hero">
      <h1>时间没有停下，<br><em>但那些光还在。</em></h1>
      <div class="memory-hero-line" aria-hidden="true"><span></span><i></i></div>
    </section>

    <section class="memory-film-section" aria-labelledby="memoryFilmTitle">
      <div class="orbit-section-heading">
        <div><h2 id="memoryFilmTitle">影像</h2></div>
      </div>
      <div class="memory-film-grid">
        <article class="memory-film-card memory-film-primary">
          <div class="memory-film-frame">
            <video controls preload="metadata" playsinline poster="photos/1.jpg">
              <source src="videos/shengrikuaile.mp4" type="video/mp4">
            </video>
          </div>
          <div><h3>生日快乐</h3></div>
        </article>
      </div>
    </section>

    <section class="memory-photo-section" aria-labelledby="memoryPhotoTitle">
      <div class="orbit-section-heading">
        <div><h2 id="memoryPhotoTitle">照片</h2></div>
      </div>
      <div class="memory-photo-grid">
        <figure class="memory-photo memory-photo-tall"><img src="photos/1.jpg" alt="回忆照片一" loading="lazy"></figure>
        <figure class="memory-photo"><img src="photos/2.jpg" alt="回忆照片二" loading="lazy"></figure>
        <figure class="memory-photo memory-photo-wide"><img src="photos/3.jpg" alt="回忆照片三" loading="lazy"></figure>
        <figure class="memory-photo memory-photo-wide"><img src="photos/4.jpg" alt="回忆照片四" loading="lazy"></figure>
        <figure class="memory-photo"><img src="photos/5.jpg" alt="回忆照片五" loading="lazy"></figure>
        <figure class="memory-photo memory-photo-tall"><img src="photos/6.jpg" alt="回忆照片六" loading="lazy"></figure>
      </div>
    </section>

    <dialog class="memory-lightbox" id="memoryLightbox" aria-label="照片预览">
      <button type="button" aria-label="关闭照片预览">×</button>
      <img alt="">
    </dialog>
  </main>

  <script src="app.js"></script>
  <script>
    (() => {
      const dialog = document.getElementById("memoryLightbox");
      const image = dialog?.querySelector("img");
      document.querySelectorAll(".memory-photo img").forEach((photo) => {
        photo.addEventListener("click", () => {
          if (!dialog || !image) return;
          image.src = photo.src;
          image.alt = photo.alt;
          dialog.showModal();
        });
      });
      dialog?.querySelector("button")?.addEventListener("click", () => dialog.close());
      dialog?.addEventListener("click", (event) => {
        if (event.target === dialog) dialog.close();
      });
    })();
  </script>
  <script src="motion-system.js?v=20260726"></script>
</body>
</html>
