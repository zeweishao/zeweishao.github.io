<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#2c3a5e">
  <meta name="description" content="星星邮差：团子从杭州的正午，飞到纽约的深夜，替我把信送到你那里。">
  <title>星星邮差｜记录爱雪雪的每一天</title>
  <link rel="icon" href="assets/journal/logo-seal.webp" type="image/webp">
  <link rel="preconnect" href="https://fonts.loli.net">
  <link rel="preconnect" href="https://gstatic.loli.net" crossorigin>
  <link rel="stylesheet" href="https://fonts.loli.net/css2?family=Noto+Serif+SC:wght@400;600;700&amp;family=Ma+Shan+Zheng&amp;display=swap" media="print" onload="this.media='all'">
  <style>
    :root {
      --paper: #f5eee3;
      --paper-deep: #ebe0cf;
      --ink: #2a2733;
      --ink-soft: #5d5866;
      --coral: #b8473f;
      --navy: #2c3a5e;
      --gold: #a9813f;
      --hand: "Ma Shan Zheng", "Kaiti SC", "STKaiti", "KaiTi", serif;
      --serif: "Noto Serif SC", "Songti SC", "STSong", serif;
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; height: 100%; overflow: hidden; background: #2c3a5e; }
    body {
      font-family: var(--serif);
      color: var(--ink);
      -webkit-tap-highlight-color: transparent;
      user-select: none;
      -webkit-user-select: none;
      touch-action: none;
    }
    canvas { position: fixed; inset: 0; width: 100%; height: 100%; display: block; }
    .grain {
      position: fixed; inset: 0; pointer-events: none;
      background: url("assets/journal/paper.webp") center / 520px;
      mix-blend-mode: multiply; opacity: .28;
    }
    .vignette {
      position: fixed; inset: 0; pointer-events: none;
      box-shadow: inset 0 0 120px rgba(20, 18, 30, .35);
    }
    button { font: inherit; color: inherit; cursor: pointer; }

    /* ---------- HUD ---------- */
    .hud { position: fixed; inset: 0; pointer-events: none; }
    .hud[hidden] { display: none; }
    .ticket {
      position: absolute; top: max(14px, env(safe-area-inset-top)); left: 50%;
      transform: translateX(-50%);
      width: min(420px, calc(100% - 96px));
      padding: 8px 14px 9px;
      background: var(--paper); border-radius: 6px;
      box-shadow: 0 6px 18px rgba(20, 18, 30, .22);
      font-size: 12px;
    }
    .ticket::before, .ticket::after {
      content: ""; position: absolute; top: 50%; width: 12px; height: 12px; margin-top: -6px;
      border-radius: 50%; background: rgba(44, 58, 94, .55);
    }
    .ticket::before { left: -6px; }
    .ticket::after { right: -6px; }
    .ticket-row { display: flex; align-items: center; gap: 10px; }
    .ticket-city { font-family: var(--hand); font-size: 17px; line-height: 1; }
    .track { position: relative; flex: 1; height: 2px; background-image: linear-gradient(90deg, var(--gold) 50%, transparent 50%); background-size: 8px 2px; }
    .track-dot {
      position: absolute; top: 50%; left: 0; width: 14px; height: 14px; margin: -7px 0 0 -7px;
      background: var(--coral);
      clip-path: polygon(50% 0, 62% 38%, 100% 50%, 62% 62%, 50% 100%, 38% 62%, 0 50%, 38% 38%);
    }
    .ticket-note { margin-top: 4px; text-align: center; color: var(--ink-soft); letter-spacing: .04em; }
    .icon-btn {
      position: absolute; top: max(14px, env(safe-area-inset-top)); width: 38px; height: 38px;
      border: 0; border-radius: 50%; background: rgba(245, 238, 227, .9);
      box-shadow: 0 4px 12px rgba(20, 18, 30, .2); pointer-events: auto;
      font-size: 16px; line-height: 38px; padding: 0;
    }
    .mute { right: 14px; }
    .back { left: 14px; }
    .strip {
      position: absolute; left: 50%; bottom: max(14px, env(safe-area-inset-bottom));
      transform: translateX(-50%) rotate(-.6deg);
      width: min(620px, calc(100% - 28px));
      min-height: 46px; max-height: 76px; overflow: hidden;
      padding: 10px 16px 10px 46px;
      background: var(--paper) url("assets/journal/paper.webp") center / 420px;
      border-radius: 4px; box-shadow: 0 8px 20px rgba(20, 18, 30, .25);
      font-family: var(--hand); font-size: 19px; line-height: 1.45;
      display: flex; flex-direction: column; justify-content: flex-end;
    }
    .strip-text { -webkit-mask-image: linear-gradient(transparent, #000 18px); mask-image: linear-gradient(transparent, #000 18px); }
    .strip::before {
      content: ""; position: absolute; left: 10px; top: 50%; width: 26px; height: 26px; margin-top: -13px;
      background: url("assets/journal/sticker-letter.webp") center / contain no-repeat;
    }
    .strip-text { color: var(--ink); }
    .strip-text .fresh { color: var(--coral); animation: ink .9s ease-out; }
    .strip-text .wait { color: rgba(42, 39, 51, .28); }
    @keyframes ink { from { opacity: 0; filter: blur(3px); } to { opacity: 1; filter: none; } }

    .whisper {
      position: fixed; left: 50%; top: 24%; transform: translate(-50%, 8px);
      max-width: calc(100% - 48px);
      padding: 8px 16px; border-radius: 18px;
      background: rgba(245, 238, 227, .92); color: var(--ink);
      font-family: var(--hand); font-size: 20px; text-align: center;
      box-shadow: 0 6px 18px rgba(20, 18, 30, .2);
      opacity: 0; transition: opacity .6s, transform .6s; pointer-events: none;
    }
    .whisper.show { opacity: 1; transform: translate(-50%, 0); }

    /* ---------- Screens ---------- */
    .screen {
      position: fixed; inset: 0; display: grid; place-items: center;
      padding: 20px 16px; overflow-x: hidden; overflow-y: auto; touch-action: pan-y;
    }
    .screen[hidden] { display: none; }
    .card {
      position: relative; width: min(460px, 100%);
      padding: 34px 26px 24px;
      background: var(--paper) url("assets/journal/paper.webp") center / 460px;
      border-radius: 6px;
      box-shadow: 0 18px 50px rgba(20, 18, 30, .35);
      text-align: center;
      animation: rise .7s cubic-bezier(.2, .8, .2, 1);
    }
    @keyframes rise { from { opacity: 0; transform: translateY(18px) rotate(-1deg); } to { opacity: 1; transform: none; } }
    .tape {
      position: absolute; top: -12px; left: 50%; width: 120px; height: 26px; margin-left: -60px;
      background: url("assets/journal/tape-navy.webp") center / cover; transform: rotate(-3deg); opacity: .92;
    }
    .eyebrow { margin: 0; font-size: 12px; letter-spacing: .3em; color: var(--gold); }
    h1 { margin: 6px 0 4px; font-family: var(--hand); font-weight: 400; font-size: 46px; line-height: 1.1; }
    .sub { margin: 0; color: var(--ink-soft); font-size: 14px; }
    .this-week {
      margin: 18px auto 0; padding: 10px 12px; border: 1px dashed rgba(169, 129, 63, .7); border-radius: 4px;
      font-size: 14px;
    }
    .this-week b { font-family: var(--hand); font-weight: 400; font-size: 21px; color: var(--coral); }
    .pick-label { margin: 20px 0 8px; font-size: 13px; color: var(--ink-soft); }
    .picker {
      display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 8px;
      padding: 4px 0 2px; touch-action: manipulation;
    }
    .picker button {
      min-width: 0;
      border: 2px solid transparent; border-radius: 10px; background: rgba(255, 255, 255, .35);
      padding: 4px 2px 3px; transition: border-color .2s, transform .2s;
    }
    .picker button img { width: 100%; aspect-ratio: 388 / 520; height: auto; object-fit: contain; display: block; pointer-events: none; }
    .picker button span { display: block; font-size: 11px; color: var(--ink-soft); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .picker button[aria-pressed="true"] { border-color: var(--coral); background: rgba(255, 255, 255, .7); transform: translateY(-2px); }
    .go {
      margin-top: 16px; padding: 12px 40px; border: 0; border-radius: 999px;
      background: var(--coral); color: #fff8ee; font-family: var(--hand); font-size: 24px; letter-spacing: .1em;
      box-shadow: 0 6px 0 #8f3530, 0 10px 20px rgba(184, 71, 63, .35);
      transition: transform .12s, box-shadow .12s;
    }
    .go:active { transform: translateY(4px); box-shadow: 0 2px 0 #8f3530, 0 4px 10px rgba(184, 71, 63, .3); }
    .hint { margin: 14px 0 0; font-size: 12px; color: var(--ink-soft); line-height: 1.7; }
    .text-link { margin-top: 10px; border: 0; background: none; color: var(--navy); font-size: 13px; text-decoration: underline; text-underline-offset: 3px; }

    /* envelope */
    .envelope {
      position: relative; width: min(340px, 86vw); aspect-ratio: 1.55; border: 0; padding: 0;
      background: #efe3cf; border-radius: 6px; box-shadow: 0 20px 50px rgba(0, 0, 0, .4);
      animation: drop 1s cubic-bezier(.2, .9, .3, 1.2);
    }
    .envelope::before {
      content: ""; position: absolute; inset: 0; border-radius: 6px;
      background: linear-gradient(to bottom right, transparent 49.5%, rgba(0,0,0,.08) 50%) left / 50% 100% no-repeat,
                  linear-gradient(to bottom left, transparent 49.5%, rgba(0,0,0,.08) 50%) right / 50% 100% no-repeat;
    }
    .envelope::after {
      content: ""; position: absolute; left: 0; right: 0; top: 0; height: 58%;
      background: #e6d6bd; clip-path: polygon(0 0, 100% 0, 50% 100%);
      filter: drop-shadow(0 2px 2px rgba(0,0,0,.12));
    }
    .envelope .seal {
      position: absolute; left: 50%; top: 58%; width: 62px; margin: -31px 0 0 -31px; z-index: 2;
      animation: pulse 1.8s ease-in-out infinite;
    }
    .envelope .postmark { position: absolute; right: 14px; bottom: 12px; width: 70px; opacity: .85; transform: rotate(-12deg); z-index: 2; }
    .envelope .to {
      position: absolute; left: 18px; bottom: 16px; z-index: 2; text-align: left;
      font-family: var(--hand); font-size: 19px; color: var(--ink); line-height: 1.3;
    }
    .tap-tip { margin-top: 18px; color: #f5eee3; font-family: var(--hand); font-size: 20px; text-align: center; opacity: .9; animation: pulse 1.8s ease-in-out infinite; }
    @keyframes drop { from { opacity: 0; transform: translateY(-60px) rotate(-8deg); } to { opacity: 1; transform: none; } }
    @keyframes pulse { 50% { transform: scale(1.06); } }

    .letter { text-align: left; padding: 38px 28px 26px; }
    .letter h2 { margin: 0 0 4px; font-family: var(--hand); font-weight: 400; font-size: 32px; text-align: center; }
    .letter .date { margin: 0 0 18px; text-align: center; font-size: 12px; letter-spacing: .2em; color: var(--gold); }
    .letter .body p {
      margin: 0 0 10px; font-family: var(--hand); font-size: 21px; line-height: 1.75;
      background-image: linear-gradient(transparent calc(100% - 1px), rgba(44, 58, 94, .16) 0);
      background-size: 100% 1.75em;
      opacity: 0; transform: translateY(6px); transition: opacity .8s, transform .8s;
    }
    .letter .body p.on { opacity: 1; transform: none; }
    .letter .sign { margin: 6px 0 0; text-align: right; font-family: var(--hand); font-size: 22px; }
    .letter .stats { margin: 16px 0 0; font-size: 12px; color: var(--ink-soft); text-align: center; }
    .row { display: flex; flex-wrap: wrap; gap: 10px; justify-content: center; margin-top: 18px; }
    .ghost {
      padding: 9px 18px; border: 1px solid rgba(42, 39, 51, .35); border-radius: 999px; background: rgba(255, 255, 255, .4);
      font-size: 14px; color: var(--ink); text-decoration: none;
    }
    .ghost.primary { background: var(--navy); color: #f5eee3; border-color: var(--navy); }

    .mail-list { list-style: none; margin: 18px 0 0; padding: 0; text-align: left; }
    .mail-list li + li { margin-top: 10px; }
    .mail-item {
      display: flex; align-items: center; gap: 12px; width: 100%; padding: 12px 14px;
      border: 1px solid rgba(42, 39, 51, .18); border-radius: 6px; background: rgba(255, 255, 255, .45); text-align: left;
    }
    .mail-item img { width: 34px; flex: none; }
    .mail-item b { display: block; font-family: var(--hand); font-weight: 400; font-size: 20px; }
    .mail-item small { color: var(--ink-soft); font-size: 12px; }
    .mail-item.locked { opacity: .7; cursor: default; }
    .mail-item .body { min-width: 0; flex: 1; }
    .mail-item b { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .author {
      display: inline-block; margin-right: 6px; padding: 1px 7px; border-radius: 999px;
      font-size: 11px; font-style: normal; color: #fff8ee; vertical-align: 1px;
    }
    .author.ze { background: var(--navy); }
    .author.xue { background: var(--coral); }
    .mail-row { display: flex; align-items: center; gap: 6px; }
    .mail-row .mail-item { flex: 1; min-width: 0; }
    .recall { flex: none; border: 0; background: none; color: var(--ink-soft); font-size: 12px; text-decoration: underline; padding: 6px 4px; }
    .mail-status { min-height: 1em; margin: 10px 0 0; font-size: 12px; color: var(--ink-soft); }
    .mail-empty { padding: 18px 8px; text-align: center; color: var(--ink-soft); font-size: 14px; }
    .whoami { display: inline-flex; align-items: center; gap: 6px; margin-top: 14px; font-size: 13px; color: var(--ink-soft); }
    .whoami button {
      min-width: 44px; padding: 5px 12px; border: 1px solid rgba(42, 39, 51, .3); border-radius: 999px;
      background: rgba(255, 255, 255, .45); font-family: var(--hand); font-size: 18px; line-height: 1.1;
    }
    .whoami button[aria-pressed="true"][data-me="泽"] { background: var(--navy); border-color: var(--navy); color: #f5eee3; }
    .whoami button[aria-pressed="true"][data-me="雪"] { background: var(--coral); border-color: var(--coral); color: #fff8ee; }
    .write-go { display: block; margin: 14px auto 0; padding: 9px 30px; font-size: 20px; }
    .writer { touch-action: auto; }
    .writer .whoami { display: flex; justify-content: center; margin: 0 0 6px; }
    .field { display: block; margin-top: 12px; font-size: 13px; color: var(--ink-soft); }
    .field > span { display: block; margin-bottom: 4px; }
    .field[hidden] { display: none; }
    .field.inline { display: flex; align-items: center; gap: 10px; }
    .field.inline > span { margin: 0; }
    .field input, .field textarea {
      width: 100%; padding: 9px 11px; border: 1px solid rgba(42, 39, 51, .25); border-radius: 4px;
      background: rgba(255, 255, 255, .6); color: var(--ink); font: inherit; font-size: 16px;
      user-select: text; -webkit-user-select: text;
    }
    .field.inline input { width: auto; flex: 1; }
    .field textarea { resize: vertical; min-height: 180px; font-family: var(--hand); font-size: 20px; line-height: 1.6; }
    .field input:focus, .field textarea:focus { outline: 2px solid rgba(184, 71, 63, .35); outline-offset: 1px; }
    .field-note { margin: 4px 0 0; font-size: 12px; color: var(--ink-soft); }
    .form-error { min-height: 1em; margin: 10px 0 0; color: var(--coral); font-size: 13px; text-align: center; }
    .this-week .author { font-family: var(--serif); }
    .mail-item .badge { margin-left: auto; font-size: 11px; color: var(--coral); white-space: nowrap; }

    @media (max-width: 420px) {
      h1 { font-size: 40px; }
      .card { padding: 30px 18px 20px; }
      .letter .body p { font-size: 19px; }
      .strip { font-size: 17px; }
      .picker { gap: 5px; }
      .picker button { padding: 3px 1px 2px; border-radius: 8px; }
      .picker button span { font-size: 10px; }
    }
    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { animation: none !important; transition: none !important; }
    }
  </style>
</head>
<body>
  <canvas id="sky" aria-label="星星邮差的天空"></canvas>
  <div class="grain"></div>
  <div class="vignette"></div>

  <div class="hud" id="hud" hidden>
    <div class="ticket">
      <div class="ticket-row">
        <span class="ticket-city" id="cityFrom">杭州</span>
        <div class="track"><i class="track-dot" id="trackDot"></i></div>
        <span class="ticket-city" id="cityTo">纽约</span>
      </div>
      <div class="ticket-note" id="ticketNote">杭州 · 正午 12:00 出发</div>
    </div>
    <button class="icon-btn back" id="backBtn" type="button" aria-label="回到封面">✕</button>
    <button class="icon-btn mute" id="muteBtn" type="button" aria-label="声音开关">♪</button>
    <div class="strip" aria-live="polite"><div class="strip-text" id="stripText"></div></div>
  </div>
  <div class="whisper" id="whisper"></div>

  <section class="screen" id="cover">
    <div class="card">
      <i class="tape"></i>
      <p class="eyebrow">STAR&nbsp;POST</p>
      <h1>星星邮差</h1>
      <p class="sub">从杭州的正午，飞到纽约的深夜</p>
      <div class="this-week" id="thisWeek"></div>
      <p class="pick-label">这次，让谁替我送信？</p>
      <div class="picker" id="picker" role="group" aria-label="选择信使"></div>
      <button class="go" id="goBtn" type="button">出发</button>
      <p class="hint">按住屏幕，气球就往上飘；松开，慢慢落下。<br>不会失败，慢慢飞，把天上的星星都接住。</p>
      <div><button class="text-link" id="mailboxBtn" type="button">打开信箱</button><span style="margin:0 10px;color:var(--ink-soft)">·</span><a class="text-link" href="index.html">回到一页情书</a></div>
    </div>
  </section>

  <section class="screen" id="envelope" hidden>
    <div>
      <button class="envelope" id="envelopeBtn" type="button" aria-label="拆开信">
        <img class="seal" src="assets/journal/logo-seal.webp" alt="">
        <img class="postmark" src="assets/journal/stamp-postmark.webp" alt="">
        <span class="to"><span id="envTo">寄给 纽约的宝宝</span><br><small id="envFrom">来自 杭州</small></span>
      </button>
      <p class="tap-tip">团子到啦，点开看看</p>
    </div>
  </section>

  <section class="screen" id="letterScreen" hidden>
    <article class="card letter">
      <i class="tape"></i>
      <h2 id="letterTitle"></h2>
      <p class="date" id="letterDate"></p>
      <div class="body" id="letterBody"></div>
      <p class="sign" id="letterSign"></p>
      <p class="stats" id="letterStats"></p>
      <div class="row">
        <button class="ghost primary" id="againBtn" type="button">再飞一次</button>
        <button class="ghost" id="toMailBtn" type="button">信箱</button>
        <a class="ghost" href="index.html">回到一页情书</a>
      </div>
    </article>
  </section>

  <section class="screen" id="mailbox" hidden>
    <div class="card">
      <i class="tape"></i>
      <p class="eyebrow">MAILBOX</p>
      <h1 style="font-size:38px">信箱</h1>
      <p class="sub">杭州和纽约之间，来来回回的信</p>
      <div class="whoami" role="group" aria-label="我是谁">
        <span>我是</span>
        <button type="button" data-me="泽">泽</button>
        <button type="button" data-me="雪">雪</button>
      </div>
      <button class="go write-go" id="writeBtn" type="button">写一封信</button>
      <p class="mail-status" id="mailStatus"></p>
      <ul class="mail-list" id="mailList"></ul>
      <div class="row"><button class="ghost" id="mailBackBtn" type="button">回到封面</button></div>
    </div>
  </section>

  <section class="screen" id="writer" hidden>
    <form class="card letter writer" id="writeForm" novalidate>
      <i class="tape"></i>
      <h2>写一封信</h2>
      <p class="date" id="writeRoute">杭州 → 纽约</p>
      <div class="whoami" role="group" aria-label="是谁写的">
        <span>署名</span>
        <button type="button" data-me="泽">泽</button>
        <button type="button" data-me="雪">雪</button>
      </div>
      <label class="field"><span>标题</span><input id="wTitle" maxlength="30" placeholder="比如：十三个小时" autocomplete="off"></label>
      <label class="field"><span>正文</span><textarea id="wText" rows="9" maxlength="2000" placeholder="想对你说的话……&#10;每个逗号、句号会把话切成一颗星星，团子会一颗颗送过去。"></textarea></label>
      <p class="field-note" id="wCount">0 字 · 0 颗星星</p>
      <label class="field inline"><span>寄到日期</span><input id="wDate" type="date"></label>
      <p class="field-note">到这一天（收信人那边的日期）才能拆开，之前只显示"还在路上"。</p>
      <label class="field" id="wPassRow" hidden><span>口令</span><input id="wPass" type="password" autocomplete="off"></label>
      <p class="form-error" id="wError" role="alert"></p>
      <div class="row">
        <button class="ghost primary" id="sendBtn" type="submit">寄出</button>
        <button class="ghost" id="writeCancel" type="button">先不寄了</button>
      </div>
    </form>
  </section>

  <script src="star-post-letters.js?v=20261107c"></script>
  <script src="star-post.js?v=20261107c"></script>
</body>
</html>
